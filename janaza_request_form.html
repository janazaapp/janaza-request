<!doctype html>
<html lang="dv" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ޖަނާޒާ ރިކުއެސްޓް</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thaana:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f4f8f6;
      font-family: "Noto Sans Thaana", sans-serif;
      color: #173b31;
      direction: rtl;
    }
    .wrap {
      width: min(100%, 520px);
      margin: 0 auto;
      padding: 18px 14px 34px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 8px 28px rgba(0,0,0,.08);
    }
    h1 {
      margin: 4px 0 8px;
      text-align: center;
      font-size: 28px;
      color: #0b5d45;
    }
    .sub {
      text-align: center;
      margin: 0 0 22px;
      color: #66756f;
      font-size: 15px;
    }
    label {
      display: block;
      margin: 16px 2px 7px;
      font-size: 18px;
      font-weight: 600;
    }
    input, select, textarea, button {
      width: 100%;
      font-family: "Noto Sans Thaana", sans-serif;
      font-size: 18px;
      direction: rtl;
    }
    input, select, textarea {
      border: 1.5px solid #c8d8d2;
      border-radius: 12px;
      padding: 13px 14px;
      background: #fff;
      color: #111;
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #0b5d45;
      box-shadow: 0 0 0 3px rgba(11,93,69,.10);
    }
    .age-row {
      display: grid;
      grid-template-columns: 1fr 1.1fr;
      gap: 10px;
    }
    .hidden { display: none; }
    .actions {
      display: grid;
      gap: 10px;
      margin-top: 24px;
    }
    button {
      border: 0;
      border-radius: 13px;
      padding: 14px 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .primary { background: #0b5d45; color: white; }
    .secondary { background: #e6f0ec; color: #0b5d45; }
    .note {
      margin-top: 15px;
      color: #6a7772;
      font-size: 14px;
      line-height: 1.8;
    }
    .ok {
      margin-top: 14px;
      background: #eef8f3;
      border: 1px solid #b8dece;
      border-radius: 12px;
      padding: 12px;
      display: none;
      color: #14563f;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>ޖަނާޒާ ރިކުއެސްޓް</h1>
      <p class="sub">މަޢުލޫމާތު ފުރިހަމަކޮށް ފުރައްވާ</p>

      <label for="name">ނަން</label>
      <input id="name" autocomplete="name" required />

      <label for="address">އެޑްރެސް</label>
      <input id="address" required />

      <label>އުމުރު</label>
      <div class="age-row">
        <select id="ageUnit" aria-label="އުމުރުގެ މިން">
          <option value="އަހަރު">އަހަރު</option>
          <option value="ދުވަސް">ދުވަސް</option>
        </select>
        <input id="age" type="number" min="0" inputmode="numeric" placeholder="65" required />
      </div>

      <label for="deathDate">ނިޔާވި ތާރީޚް</label>
      <input id="deathDate" type="date" required />

      <label for="burialDate">ކަށުނަމާދު ކުރެވޭ ތާރީޚް</label>
      <input id="burialDate" type="date" required />

      <label for="burialTime">ވަގުތު</label>
      <select id="burialTime" required>
        <option value="">އިޚްތިޔާރު ކުރައްވާ</option>
        <option>ފަތިސް ނަމާދަށް ފަހު</option>
        <option>މެންދުރު ނަމާދަށް ފަހު</option>
        <option>އަސްރު ނަމާދަށް ފަހު</option>
        <option>މަޣްރިބް ނަމާދަށް ފަހު</option>
        <option>ޢިޝާ ނަމާދަށް ފަހު</option>
        <option>ހުކުރު ނަމާދަށް ފަހު</option>
        <option value="OTHER">އެހެން ވަގުތެއް</option>
      </select>
      <input id="customBurialTime" class="hidden" placeholder="ވަގުތު ލިޔުއްވާ" style="margin-top:10px" />

      <label for="graveLocation">މައްޔިތާ ވަޅުލުން</label>
      <select id="graveLocation" required>
        <option value="">އިޚްތިޔާރު ކުރައްވާ</option>
        <option>ރަޙްމާ ސަހަރާގައި</option>
        <option>ޢުލާ ސަހަރާގައި</option>
        <option value="OTHER">އެހެން ސަހަރާއެއް</option>
      </select>
      <input id="customGraveLocation" class="hidden" placeholder="ސަހަރާ ލިޔުއްވާ" style="margin-top:10px" />

      <label for="mosque">މިސްކިތް</label>
      <select id="mosque" required>
        <option value="">އިޚްތިޔާރު ކުރައްވާ</option>
        <option>ޙަޟާރަތު</option>
        <option>ޙަސަނާތު</option>
        <option>ނޫރު</option>
        <option>ޖަމާޢަތު</option>
        <option>ފިރުދައުސް</option>
        <option>މުޙައްމަދު</option>
        <option value="OTHER">އެހެން މިސްކިތެއް</option>
      </select>
      <input id="customMosque" class="hidden" placeholder="މިސްކިތުގެ ނަން ލިޔުއްވާ" style="margin-top:10px" />

      <div class="actions">
        <button class="primary" id="shareBtn" type="button">ރިކުއެސްޓް ހިއްސާކުރޭ</button>
        <button class="secondary" id="downloadBtn" type="button">ރިކުއެސްޓް ފައިލް ޑައުންލޯޑްކުރޭ</button>
      </div>

      <div id="status" class="ok"></div>
      <p class="note">ހިއްސާކުރާ ބަޓަން ނުހިނގާ ފޯނެއްގައި ފައިލް ޑައުންލޯޑްކޮށް ވައިބަރ މެދުވެރިކޮށް އެޑްމިނަށް ފޮނުއްވާ.</p>
    </section>
  </main>

<script>
const $ = id => document.getElementById(id);

function showCustom(selectId, inputId) {
  const sel = $(selectId), inp = $(inputId);
  const update = () => inp.classList.toggle("hidden", sel.value !== "OTHER");
  sel.addEventListener("change", update);
  update();
}
showCustom("burialTime", "customBurialTime");
showCustom("graveLocation", "customGraveLocation");
showCustom("mosque", "customMosque");

function ddmmyyyy(v) {
  if (!v) return "";

  const parts = v.split("-");

  if (parts.length === 3) {
    const year = parts[0];
    const month = parts[1];
    const day = parts[2];

    return day + "-" + month + "-" + year;
  }

  return v;
}
function chosen(selectId, customId) {
  return $(selectId).value === "OTHER" ? $(customId).value.trim() : $(selectId).value;
}
function requestText() {
  const required = ["name","address","age","deathDate","burialDate","burialTime","graveLocation","mosque"];
  for (const id of required) {
    if (!$(id).value) {
      $(id).focus();
      alert("އެ ފީލްޑް ފުރައްވާ");
      return null;
    }
  }
  const burialTime = chosen("burialTime","customBurialTime");
  const graveLocation = chosen("graveLocation","customGraveLocation");
  const mosque = chosen("mosque","customMosque");
  if (!burialTime || !graveLocation || !mosque) {
    alert("އިތުރު މަޢުލޫމާތު ފުރައްވާ");
    return null;
  }
  return [
    `NAME=${$("name").value.trim()}`,
    `ADDRESS=${$("address").value.trim()}`,
    `AGE=${$("age").value.trim()} ${$("ageUnit").value}`,
    `DEATH_DATE=${ddmmyyyy($("deathDate").value)}`,
    `BURIAL_DATE=${ddmmyyyy($("burialDate").value)}`,
    `BURIAL_TIME=${burialTime}`,
    `GRAVE_LOCATION=${graveLocation}`,
    `MOSQUE=${mosque}`
  ].join("\n");
}
function makeFile() {
  const text = requestText();
  if (text === null) return null;
  return new File([text], "janaza_request.txt", { type: "text/plain;charset=utf-8" });
}
$("downloadBtn").addEventListener("click", () => {
  const file = makeFile();
  if (!file) return;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(file);
  a.download = file.name;
  a.click();
  URL.revokeObjectURL(a.href);
  $("status").style.display = "block";
  $("status").textContent = "ރިކުއެސްޓް ފައިލް އުފެދިއްޖެ.";
});
$("shareBtn").addEventListener("click", async () => {
  const file = makeFile();
  if (!file) return;
  try {
    if (navigator.canShare && navigator.canShare({files:[file]})) {
      await navigator.share({
        title: "ޖަނާޒާ ރިކުއެސްޓް",
        text: "ޖަނާޒާ ރިކުއެސްޓް",
        files: [file]
      });
    } else {
      $("downloadBtn").click();
    }
  } catch (e) {
    if (e.name !== "AbortError") $("downloadBtn").click();
  }
});
</script>
</body>
</html>
